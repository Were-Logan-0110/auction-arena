services:
  - type: web
    name: auction-arena
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # web/dist is already committed, so no npm build needed on Render.
    # If you want Render to rebuild frontend, use: pip install -r requirements.txt && cd web && npm ci && npm run build
    startCommand: python server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
